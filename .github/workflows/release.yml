name: Release

# A `v*` tag builds both packages and publishes them as a GitHub Release.
# "Run workflow" builds them as downloadable artifacts, without a Release, and
# so does a pull request that changes the packaging, so a tag never meets an
# untested build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - deploy/client/**

# Actions are pinned to a commit, with the tag it was beside it: a tag can be
# moved to different code, a commit cannot.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Only a pull request's run is superseded by a newer push; a tag's never is.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The dx version this repo is built with (see the root README).
  DIOXUS_CLI_VERSION: 0.7.10
  # Names the archives: the tag for a release, else empty, and the scripts
  # fall back to the commit.
  LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
  # Public halves of the two release keys. Both are also what installed
  # copies trust, so neither changes without a plan for those copies: the
  # certificate the macOS app is signed with (its SHA-1), and the key the
  # checksums are signed with (ed25519, hex; the same constant as in
  # app/src/update).
  SIGNING_CERT_SHA1: b939a06a0b214a2618022698cbd1cf949fd97fad
  UPDATE_PUBLIC_KEY: 3037bc237610cf020580fdd0851508f79935c31056187e56167d70b3a5bfa191

jobs:
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: compare
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' app/Cargo.toml | head -1)
          echo "app/Cargo.toml version: $version"
          if [ -z "$LABEL" ]; then
            echo "not a tag; nothing to compare"
          elif [ "$LABEL" != "v$version" ]; then
            echo "::error::tag $LABEL does not match app/Cargo.toml version $version"
            exit 1
          fi

  # One job per architecture, at the same time: each is a full compile of the
  # app, and one after the other they were most of a release's wait.
  macos-build:
    name: macOS build (${{ matrix.target }})
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app
          key: ${{ matrix.target }}

      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      - name: build
        working-directory: app
        run: dx build --renderer native --release --target "$TARGET"

      # The binary from each, and the bundle (assets, Info.plist) from the
      # Apple Silicon one. In a tar: an artifact on its own loses the
      # executable bit and the bundle's links. Named so that the jobs below,
      # which collect `vdr-*`, never mistake a half for a package.
      - name: collect
        run: |
          mkdir out
          cp "app/target/$TARGET/desktop-release/vdr" out/vdr
          if [ "$TARGET" = aarch64-apple-darwin ]; then
            cp -R app/target/dx/vdr/release/macos/Vdr.app out/Vdr.app
          fi
          tar -C out -cf "half-$TARGET.tar" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: half-${{ matrix.target }}
          path: half-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS universal
    needs: macos-build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: half-*
          path: halves
          merge-multiple: true

      # Where package-macos.sh's own builds would have left them.
      - name: place the builds
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            mkdir -p "halves/$target" "app/target/$target/desktop-release"
            tar -C "halves/$target" -xf "halves/half-$target.tar"
            cp "halves/$target/vdr" "app/target/$target/desktop-release/vdr"
          done
          mkdir -p app/target/dx/vdr/release/macos
          cp -R halves/aarch64-apple-darwin/Vdr.app app/target/dx/vdr/release/macos/Vdr.app
          file app/target/*/desktop-release/vdr

      # One certificate for every release, so macOS treats an update as the
      # same app and keeps its camera, microphone and screen grants. It is
      # self-signed: it proves "the same publisher as last time", not who that
      # is. A run without the secret (a fork) signs ad hoc instead.
      - name: signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            if [ -n "$LABEL" ] && [ "$GITHUB_REPOSITORY" = "dsegovia90/vdr" ]; then
              echo "::error::a release needs the signing certificate"
              exit 1
            fi
            echo "::warning::no signing certificate here; the app is signed ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 16)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -p codesigning "$keychain" \
            | awk '/^ *1\)/ {print $2}')
          # A different certificate would cost every installed copy its grants.
          if [ "$(printf '%s' "$identity" | tr 'A-F' 'a-f')" != "$SIGNING_CERT_SHA1" ]; then
            echo "::error::the certificate in the secret is not the one releases are signed with"
            exit 1
          fi
          echo "VDR_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "VDR_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # The same script as a local `just package-mac`: universal binary,
      # signed, usage keys checked, zipped with the guide and licences.
      - name: package
        env:
          VDR_MAC_PREBUILT: 1
        run: deploy/client/package-macos.sh "$LABEL"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vdr-macos-universal
          path: dist/vdr-macos-*.zip
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x86_64
    needs: version
    # The package's glibc floor: what it is built on is the oldest it runs on.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Before dx is compiled, which links against some of them.
      - name: build dependencies
        run: deploy/client/linux-deps.sh

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app

      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      # The script the portable container build runs, here straight on the
      # runner: the same Ubuntu 22.04, PipeWire built from source for
      # `wayland-share`.
      - name: package
        run: SKIP_PACKAGES=1 deploy/client/build-linux.sh "$LABEL"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vdr-linux-x86_64
          path: dist/vdr-linux-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  # The checksums of both packages, signed. An installed app updates itself
  # only from a package whose checksum is in a list signed by this key, so the
  # key matters more than anything else here: lose it and no installed copy
  # can ever be updated again; leak it and anyone who can also change a
  # Release can ship code to them.
  checksums:
    name: signed checksums
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: vdr-*
          path: dist
          merge-multiple: true

      - name: sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          (cd dist && sha256sum vdr-* > SHA256SUMS && cat SHA256SUMS)
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ -n "$LABEL" ] && [ "$GITHUB_REPOSITORY" = "dsegovia90/vdr" ]; then
              echo "::error::a release needs the update signing key"
              exit 1
            fi
            echo "::warning::no update signing key here; the checksums are unsigned"
            exit 0
          fi
          key="$RUNNER_TEMP/update.pem"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
          # The app carries the public half. A signature it cannot check is
          # worse than none: every copy would refuse the update.
          public=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | xxd -p -c 64)
          if [ "$public" != "$UPDATE_PUBLIC_KEY" ]; then
            rm "$key"
            echo "::error::the signing key in the secret does not match the public key in the app"
            exit 1
          fi
          # Raw ed25519 over the file's bytes: 64 bytes, no container.
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/update.pub"
          rm "$key"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/update.pub" \
            -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
          [ "$(wc -c < dist/SHA256SUMS.sig)" -eq 64 ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checksums
          path: dist/SHA256SUMS*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, checksums]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: vdr-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checksums
          path: dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS && ls -l)
          gh release create "$LABEL" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "vdr $LABEL" \
            --generate-notes \
            --verify-tag
