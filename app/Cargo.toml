[package]
name = "vdr"
version = "0.1.0"
authors = ["Daniel Segovia <segoarce90@gmail.com>"]
edition = "2021"

[dependencies]
cameras = "0.3.2"
# Media pipeline for the network path: encode, decode, publish, subscribe.
# Git because iroh-live's crates are unpublished path-only workspace members.
# No capture (we use `cameras`) and no wgpu -- moq-media keeps wgpu behind an
# optional feature, which is what lets it coexist with our pinned blitz.
moq-media = { git = "https://github.com/n0-computer/iroh-live", default-features = false, features = ["h264"] }
# The renderer, used directly rather than through the `dioxus` umbrella: the
# umbrella's `native` feature did not exist at 0.7.0, and this revision is
# 0.7.0. `prelude` brings dioxus-core/hooks/signals/manganis with it, which is
# how iroh-live's own dioxus integration depends on blitz too.
#
# Pinned to a revision because blitz 0.2.x ships stylo 0.8, which fails to
# compile once `derive_more`'s debug/eq features are unified into the graph --
# and every iroh-live crate does that. This revision carries stylo 0.14.
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "f83b2bc", features = ["prelude", "tracing"] }
bytes = "1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
wgpu = "27"
