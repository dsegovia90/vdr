[package]
name = "vdr"
version = "0.1.0"
authors = ["Daniel Segovia <segoarce90@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# Screen sharing on Wayland: moq-video's portal + PipeWire capture. It is the
# only way to capture a Wayland screen; without it a Wayland session falls
# through to X11 capture, which sees only XWayland windows. Unlike VA-API and
# NVENC it links libpipewire-0.3 rather than `dlopen`ing it.
#
# **Off by default; the Linux package turns it on** (`build-linux.sh` passes
# `--features wayland-share` to `dx build`). Off here so `cargo test`/clippy on a
# Linux box need no PipeWire headers. The `pipewire`/`libspa` 0.10 crates need
# PipeWire 0.3.65 or newer to compile; the portable build's Ubuntu 22.04 (kept
# for its glibc 2.35) has 0.3.48, so that script builds a newer PipeWire from
# source to compile and link against, and the binary loads the recipient's own
# `libpipewire-0.3.so.0` at runtime. On a recent distro, build with
# `--features wayland-share`. Only Linux reads it: moq-video gates the PipeWire
# code to Linux itself.
wayland-share = ["moq-video/pipewire"]

[dependencies]
cameras = "0.3.2"
# The renderer, used directly rather than through the `dioxus` umbrella: the
# umbrella's `native` feature did not exist at 0.7.0, and this revision is
# 0.7.0. `prelude` brings dioxus-core/hooks/signals/manganis with it.
#
# Pinned to a git tag because blitz 0.2.x ships stylo 0.8, which fails to
# compile once `derive_more`'s debug/eq features are unified into the graph.
# `v0.3.0-beta.4` carries stylo 0.22 and wgpu 30 (moved from rev `f83b2bc`,
# whose stylo no longer compiled). It is a tag, not crates.io, because no `dioxus-native` 0.7.x
# release carries a new blitz; 0.8.0-alpha.3 does, but needs Dioxus 0.8.
#
# Known cost of beta.4: colours are oversaturated on wide-gamut (P3) screens.
# wgpu 30's Metal backend tells the layer to do no colour matching. The fix is
# merged upstream (wgpu #10286, anyrender #138) but unreleased. Do not
# compensate in our shader: that would double-correct once the fix ships.
#
# The unification used to come from `iroh-live`; that dependency is gone and the
# pin is still load-bearing, because `hang 0.20` (via moq-mux/moq-video) and
# `iroh 1.1` both pull `derive_more` in on their own. Verify with
# `cargo tree -i derive_more` before concluding this pin is stale.
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", tag = "v0.3.0-beta.4", features = ["prelude", "tracing"] }
# Needed to name the `Widget` API types the video tiles implement (it replaced
# `CustomPaintSource` in beta.4). Same tag as dioxus-native, or the two disagree.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", tag = "v0.3.0-beta.4", default-features = false }
anyrender = "0.14"
peniko = "0.6"
anyhow = "1"
bytes = "1"
futures-channel = "0.3"
# Only for `EndpointId`, which is how a peer is named on the command line.
# `moq-native` does not re-export it. No features of our own: cargo unifies this
# with the set `moq-native` already asks for, so this adds nothing to the build.
iroh = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false }
# Settings persistence. `directories` gives the per-platform config
# location -- `data_local_dir()`, which is what dioxus-sdk-storage's own desktop
# backend uses, so this is the conventional spot and not one we invented.
# `serde`/`serde_json` are already in the tree via the moq stack, so declaring
# them direct adds no packages; `directories` adds three.
#
# NOT `dioxus-sdk-storage`, the official crate: it needs the `dioxus` umbrella
# (31 packages) and `unwrap()`s every filesystem error, which would take the app
# down on a read-only home directory.
# The Copy button for our own key. dioxus-native's `convert_clipboard_data` is
# `unimplemented!()` and blitz's clipboard is private to its keyboard handler,
# so writing to the clipboard needs this directly. Already compiled underneath
# blitz-shell, so declaring it adds no packages.
# `default-features = false` drops `image-data`, which would pull jpeg/tiff
# decoders for a clipboard we only ever put text on.
arboard = { version = "3", default-features = false }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The decode pipeline calls `tokio::spawn`, so building one needs a runtime in
# context even for the in-process loopback -- there is no non-async way in.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
# `env-filter` named here rather than relied on through another crate: the
# default log filter in `main.rs` builds one.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The moq stack: the whole network path (it replaced `iroh-live` and
# `moq-media`). `hang` is deliberately NOT a direct dependency -- the
# catalog types we touch reach us through `moq-mux`.
#
# Keep moq-video's `render` feature OFF. It used to be forbidden because it
# pulls wgpu 30 while vello owned our device at 27. Since beta.4 we are on 30
# too, so that reason is gone, but nobody has checked whether its renderer and
# vello can share a device. Until someone does, it stays off. The Cargo.lock
# also carries wgpu 29 via anyrender_vello_cpu -> pixels, which is target-gated
# and never on the host (`cargo tree -i wgpu@29.0.4` prints nothing).
moq-net   = { version = "0.3",  default-features = false }
moq-mux   = { version = "0.10", default-features = false }
# The control plane, and it costs nothing: `moq-mux` already pulls this in to
# publish the catalog, so declaring it adds no package to the build. The catalog
# we read on every call is one of these documents, which is the evidence that
# the model carries small structured state.
moq-json  = { version = "0.5",  default-features = false }
# `openh264` is the software codec, opt-in since 0.1: without it a machine with
# no hardware codec could neither send nor receive video. `capture` is screen
# capture, for sharing a screen; on macOS it adds no package (ScreenCaptureKit is
# already in the tree), on Linux it adds X11 capture.
moq-video = { version = "0.1.21", default-features = false, features = ["openh264", "capture"] }
moq-audio = { version = "0.1.21", default-features = false, features = ["capture", "playback", "aec"] }
# Was `moq-native`, renamed upstream. Its QUIC backend is now `noq`.
moq-tokio = { version = "0.19.34", default-features = false, features = ["iroh", "noq", "aws-lc-rs"] }
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
url = "2"
wgpu = "30"

# Hardware video on Linux: VA-API (Intel, AMD) and NVENC/NVDEC (Nvidia), each
# falling back to openh264. Both `dlopen` their libraries, so the portable
# package still starts on machines without libva or an Nvidia driver. VA-API
# runs bindgen at build time, which needs clang (installed by build-linux.sh).
#
# Screen capture on Linux is X11's (`capture`). Wayland's, through the desktop
# portal and PipeWire, is the `wayland-share` feature above, on in the Linux package.
[target.'cfg(target_os = "linux")'.dependencies]
moq-video = { version = "0.1.21", default-features = false, features = ["openh264", "vaapi", "nvidia", "capture"] }

# A patched moq-audio: exposes the echo canceller's own statistics (sonora's
# ERLE, delay estimate, residual echo likelihood), which upstream keeps private, and carries the echo fix.
# See vendor/moq-audio/PATCH.md. Drop this once upstream exposes them.
[patch.crates-io]
moq-audio = { path = "vendor/moq-audio" }
# A patched moq-video: its PipeWire capture rejects every DMA-BUF frame whose
# chunk size is smaller than the frame, and xdg-desktop-portal-hyprland writes a
# placeholder 9 there, so screen share never starts on Hyprland. See
# vendor/moq-video/PATCH.md. Drop this once an upstream release fixes it.
moq-video = { path = "vendor/moq-video" }

# A patched blitz-dom: its hit test unwraps child ids that a DOM change has
# already removed, and panics if the pointer moves before the next layout.
# Same tag as dioxus-native. See vendor/blitz-dom/PATCH.md. Drop this once
# a blitz release we can take carries the fix.
[patch."https://github.com/DioxusLabs/blitz"]
blitz-dom = { path = "vendor/blitz-dom" }
