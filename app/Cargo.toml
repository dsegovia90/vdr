[package]
name = "vdr"
version = "0.1.0"
authors = ["Daniel Segovia <segoarce90@gmail.com>"]
edition = "2021"

[dependencies]
cameras = "0.3.2"
# The renderer, used directly rather than through the `dioxus` umbrella: the
# umbrella's `native` feature did not exist at 0.7.0, and this revision is
# 0.7.0. `prelude` brings dioxus-core/hooks/signals/manganis with it.
#
# Pinned to a git tag because blitz 0.2.x ships stylo 0.8, which fails to
# compile once `derive_more`'s debug/eq features are unified into the graph.
# `v0.3.0-beta.4` carries stylo 0.22 and wgpu 30 (ticket 0, moved from rev
# `f83b2bc`). It is a tag, not crates.io, because no `dioxus-native` 0.7.x
# release carries a new blitz; 0.8.0-alpha.3 does, but needs Dioxus 0.8.
#
# Known cost of beta.4: colours are oversaturated on wide-gamut (P3) screens.
# wgpu 30's Metal backend tells the layer to do no colour matching. The fix is
# merged upstream (wgpu #10286, anyrender #138) but unreleased; see ticket 0.
#
# The unification used to come from `iroh-live`; ticket 20e removed it and the
# pin is still load-bearing, because `hang 0.20` (via moq-mux/moq-video) and
# `iroh 1.1` both pull `derive_more` in on their own. Verify with
# `cargo tree -i derive_more` before concluding this pin is stale.
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", tag = "v0.3.0-beta.4", features = ["prelude", "tracing"] }
# Needed to name the `Widget` API types the video tiles implement (it replaced
# `CustomPaintSource` in beta.4). Same tag as dioxus-native, or the two disagree.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", tag = "v0.3.0-beta.4", default-features = false }
anyrender = "0.14"
peniko = "0.6"
anyhow = "1"
bytes = "1"
futures-channel = "0.3"
# Only for `EndpointId`, which is how a peer is named on the command line.
# `moq-native` does not re-export it. No features of our own: cargo unifies this
# with the set `moq-native` already asks for, so this adds nothing to the build.
iroh = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false }
# Settings persistence (ticket 17). `directories` gives the per-platform config
# location -- `data_local_dir()`, which is what dioxus-sdk-storage's own desktop
# backend uses, so this is the conventional spot and not one we invented.
# `serde`/`serde_json` are already in the tree via the moq stack, so declaring
# them direct adds no packages; `directories` adds three.
#
# NOT `dioxus-sdk-storage`, the official crate: it needs the `dioxus` umbrella
# (31 packages) and `unwrap()`s every filesystem error, which would take the app
# down on a read-only home directory. See `doc/dstack/vid/tickets/17.md`.
# The Copy button for our own key. dioxus-native's `convert_clipboard_data` is
# `unimplemented!()` and blitz's clipboard is private to its keyboard handler,
# so writing to the clipboard needs this directly. Already compiled underneath
# blitz-shell, so declaring it adds no packages.
# `default-features = false` drops `image-data`, which would pull jpeg/tiff
# decoders for a clipboard we only ever put text on.
arboard = { version = "3", default-features = false }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The decode pipeline calls `tokio::spawn`, so building one needs a runtime in
# context even for the in-process loopback -- there is no non-async way in.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# The moq stack: the whole network path, since ticket 20e retired the last of
# `iroh-live`/`moq-media`. `hang` is deliberately NOT a direct dependency -- the
# catalog types we touch reach us through `moq-mux`.
#
# Keep moq-video's `render` feature OFF. It used to be forbidden because it
# pulls wgpu 30 while vello owned our device at 27. Since beta.4 we are on 30
# too, so that reason is gone, but nobody has checked whether its renderer and
# vello can share a device. Until someone does, it stays off. The Cargo.lock
# also carries wgpu 29 via anyrender_vello_cpu -> pixels, which is target-gated
# and never on the host (`cargo tree -i wgpu@29.0.4` prints nothing).
moq-net   = { version = "0.2",  default-features = false }
moq-mux   = { version = "0.9",  default-features = false }
# The control plane, and it costs nothing: `moq-mux` already pulls this in to
# publish the catalog, so declaring it adds no package to the build. The catalog
# we read on every call is one of these documents, which is the evidence that
# the model carries small structured state.
moq-json  = { version = "0.3",  default-features = false }
moq-video = { version = "0.0.22", default-features = false }
moq-audio = { version = "0.0.22", default-features = false, features = ["capture", "playback", "aec"] }
moq-native = { version = "0.19", default-features = false, features = ["iroh", "quinn", "aws-lc-rs"] }
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
url = "2"
wgpu = "30"
