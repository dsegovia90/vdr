[package]
name = "vdr"
version = "0.1.0"
authors = ["Daniel Segovia <segoarce90@gmail.com>"]
edition = "2021"

[dependencies]
cameras = "0.3.2"
dioxus = { version = "0.7.10", features = ["native"] }
# Not used directly. Named only to turn on dioxus-native's `tracing` feature,
# so `RUST_LOG=dioxus_native=trace` shows which asset path was requested. It
# does not make a missing asset loud -- `warn_if_unbundled` covers that.
dioxus-native = { version = "0.7.10", features = ["tracing"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
wgpu = "26"
