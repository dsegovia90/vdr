[package]
name = "vdr"
version = "0.1.0"
authors = ["Daniel Segovia <segoarce90@gmail.com>"]
edition = "2021"

[dependencies]
cameras = "0.3.2"
# Media pipeline for the network path: encode, decode, publish, subscribe.
# Git because iroh-live's crates are unpublished path-only workspace members.
# No capture (we use `cameras`) and no wgpu -- moq-media keeps wgpu behind an
# optional feature, which is what lets it coexist with our pinned blitz.
moq-media = { git = "https://github.com/n0-computer/iroh-live", default-features = false, features = ["h264"] }
# The transport: iroh endpoints, MoQ sessions, and the 1:1 `Call` helper. Same
# repo and revision as `moq-media`, so cargo unifies them. No capture and no
# wgpu here either -- `Call` is the only part we use.
iroh-live = { git = "https://github.com/n0-computer/iroh-live", default-features = false, features = ["h264"] }
# The renderer, used directly rather than through the `dioxus` umbrella: the
# umbrella's `native` feature did not exist at 0.7.0, and this revision is
# 0.7.0. `prelude` brings dioxus-core/hooks/signals/manganis with it, which is
# how iroh-live's own dioxus integration depends on blitz too.
#
# Pinned to a revision because blitz 0.2.x ships stylo 0.8, which fails to
# compile once `derive_more`'s debug/eq features are unified into the graph --
# and every iroh-live crate does that. This revision carries stylo 0.14.
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "f83b2bc", features = ["prelude", "tracing"] }
anyhow = "1"
bytes = "1"
futures-channel = "0.3"
# Only for `EndpointId`, which is how a peer is named on the command line.
# `iroh-live` does not re-export it. No features of our own: cargo unifies this
# with the set `iroh-live` already asks for, so this adds nothing to the build.
iroh = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false }
# The decode pipeline calls `tokio::spawn`, so building one needs a runtime in
# context even for the in-process loopback -- there is no non-async way in.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# The moq stack. Coexists with `iroh-live`/`moq-media` above -- moq-net 0.1 and
# 0.2, hang 0.19 and 0.20 all resolve together -- while the call path migrates.
#
# NEVER enable moq-video's `render` feature: it pulls wgpu 30 and vello owns our
# device at 27. Guard: `cargo tree --target <host> | grep "wgpu v30"` must be
# empty. A Cargo.lock grep false-positives on anyrender_vello_cpu's wgpu 0.19.
hang      = { version = "0.20", default-features = false }
moq-net   = { version = "0.2",  default-features = false }
moq-mux   = { version = "0.9",  default-features = false }
moq-video = { version = "0.0.22", default-features = false }
moq-native = { version = "0.19", default-features = false, features = ["iroh", "quinn", "aws-lc-rs"] }
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
url = "2"
wgpu = "27"
